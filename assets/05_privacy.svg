<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0F1626"/>
      <stop offset="1" stop-color="#070B14"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.55">
      <stop offset="0" stop-color="#3F86FF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#3F86FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shieldFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3F86FF"/>
      <stop offset="1" stop-color="#0A59F7"/>
    </linearGradient>
    <filter id="shieldGlow" x="-30%" y="-20%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="32"/>
      <feOffset dx="0" dy="20"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.6"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1080" height="1920" fill="url(#bg)"/>
  <ellipse cx="540" cy="760" rx="640" ry="520" fill="url(#glow)"/>

  <text x="540" y="200" text-anchor="middle"
        font-family="PingFang SC, Hiragino Sans GB, Heiti SC, sans-serif"
        font-size="84" font-weight="800" fill="#FFFFFF" letter-spacing="2">秘钥 · 永不离开本机</text>
  <text x="540" y="282" text-anchor="middle"
        font-family="PingFang SC, Hiragino Sans GB, Heiti SC, sans-serif"
        font-size="38" font-weight="400" fill="#A8B2C7" letter-spacing="2">系统级凭据库 · 与设备锁绑定 · 全程离线</text>

  <!-- 大盾牌 -->
  <g filter="url(#shieldGlow)" transform="translate(380 400)">
    <path d="M 160 0 L 280 60 L 280 200 C 280 300 220 360 160 380 C 100 360 40 300 40 200 L 40 60 Z" fill="url(#shieldFill)"/>
    <g transform="translate(160 200)" stroke="#FFFFFF" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M -52 0 L -16 36 L 60 -40"/>
    </g>
  </g>

  <text x="540" y="900" text-anchor="middle"
        font-family="PingFang SC, Hiragino Sans GB, Heiti SC, sans-serif"
        font-size="44" font-weight="700" fill="#FFFFFF" letter-spacing="4">本地优先 · 零云端</text>
  <text x="540" y="970" text-anchor="middle"
        font-family="PingFang SC, Hiragino Sans GB, Heiti SC, sans-serif"
        font-size="28" fill="#A8B2C7" letter-spacing="2">秘钥仅写入 HarmonyOS Asset Store Kit</text>

  <!-- 3 个特性卡片 -->
  <g transform="translate(80 1100)">
    <rect x="0" y="0" width="920" height="160" rx="32" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <g transform="translate(40 40)">
      <circle cx="40" cy="40" r="40" fill="#0A59F7"/>
      <g transform="translate(20 18)" stroke="#FFFFFF" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M 12 20 V 14 a 8 8 0 1 1 16 0 V 20"/>
        <rect x="6" y="20" width="28" height="22" rx="4" fill="#FFFFFF" stroke="none"/>
      </g>
    </g>
    <text x="160" y="74"
          font-family="PingFang SC, Hiragino Sans GB, Heiti SC, sans-serif"
          font-size="34" font-weight="600" fill="#FFFFFF">系统级凭据库存储</text>
    <text x="160" y="120"
          font-family="PingFang SC, Hiragino Sans GB, Heiti SC, sans-serif"
          font-size="26" fill="#A8B2C7">秘钥永不写入应用沙箱 · 不可被第三方读取</text>
  </g>

  <g transform="translate(80 1290)">
    <rect x="0" y="0" width="920" height="160" rx="32" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <g transform="translate(40 40)">
      <circle cx="40" cy="40" r="40" fill="#0A59F7"/>
      <g transform="translate(18 18)" stroke="#FFFFFF" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="22" cy="22" r="20"/>
        <line x1="6" y1="6" x2="38" y2="38"/>
      </g>
    </g>
    <text x="160" y="74"
          font-family="PingFang SC, Hiragino Sans GB, Heiti SC, sans-serif"
          font-size="34" font-weight="600" fill="#FFFFFF">全程零联网</text>
    <text x="160" y="120"
          font-family="PingFang SC, Hiragino Sans GB, Heiti SC, sans-serif"
          font-size="26" fill="#A8B2C7">不申请网络权限 · 无广告 · 无埋点 · 无追踪</text>
  </g>

  <g transform="translate(80 1480)">
    <rect x="0" y="0" width="920" height="160" rx="32" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <g transform="translate(40 40)">
      <circle cx="40" cy="40" r="40" fill="#0A59F7"/>
      <g transform="translate(20 18)" stroke="#FFFFFF" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M 4 28 L 20 38 L 36 28 L 36 14 L 20 6 L 4 14 Z"/>
        <line x1="20" y1="22" x2="20" y2="38"/>
        <line x1="4" y1="14" x2="20" y2="22"/>
        <line x1="36" y1="14" x2="20" y2="22"/>
      </g>
    </g>
    <text x="160" y="74"
          font-family="PingFang SC, Hiragino Sans GB, Heiti SC, sans-serif"
          font-size="34" font-weight="600" fill="#FFFFFF">RFC 6238 标准兼容</text>
    <text x="160" y="120"
          font-family="PingFang SC, Hiragino Sans GB, Heiti SC, sans-serif"
          font-size="26" fill="#A8B2C7">与 Google Authenticator 等主流验证器互通</text>
  </g>

  <!-- 底部 logo -->
  <g transform="translate(440 1810)">
    <rect x="0" y="-50" width="64" height="64" rx="14" fill="#0A59F7"/>
    <g transform="translate(32 -18)">
      <rect x="-14" y="-4" width="28" height="8" rx="4" fill="#FFFFFF"/>
      <rect x="-14" y="-4" width="28" height="8" rx="4" fill="#FFFFFF" transform="rotate(60)"/>
      <rect x="-14" y="-4" width="28" height="8" rx="4" fill="#FFFFFF" transform="rotate(120)"/>
    </g>
    <text x="84" y="0" font-family="PingFang SC, Hiragino Sans GB, Heiti SC, sans-serif"
          font-size="40" font-weight="700" fill="#FFFFFF">Rotor</text>
  </g>
</svg>
