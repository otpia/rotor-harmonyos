<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E7EEFC"/>
      <stop offset="1" stop-color="#F4F6FA"/>
    </linearGradient>
    <filter id="phoneShadow" x="-10%" y="-5%" width="120%" height="115%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="24"/>
      <feOffset dx="0" dy="24"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.18"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="phoneClip">
      <rect x="0" y="0" width="920" height="1380" rx="56"/>
    </clipPath>
  </defs>

  <rect width="1080" height="1920" fill="url(#bg)"/>

  <text x="540" y="180" text-anchor="middle"
        font-family="PingFang SC, Hiragino Sans GB, Heiti SC, sans-serif"
        font-size="84" font-weight="800" fill="#0F1B2D" letter-spacing="2">AES 加密备份 · 安心迁移</text>
  <text x="540" y="262" text-anchor="middle"
        font-family="PingFang SC, Hiragino Sans GB, Heiti SC, sans-serif"
        font-size="38" font-weight="400" fill="#5A6478" letter-spacing="2">自定义密码 · 离线生成 · 永不上云</text>

  <!-- Phone mockup, vp→px 系数 1.8 -->
  <g filter="url(#phoneShadow)" transform="translate(80 360)">
    <rect x="0" y="0" width="920" height="1380" rx="56" fill="#F1F3F5"/>

    <g clip-path="url(#phoneClip)">
      <!-- ===== ExportPage 背景层 ===== -->

      <!-- Nav (56vp): back icon + 编辑 -->
      <g transform="translate(29 29)">
        <g stroke="#0F1B2D" stroke-width="3.6" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <path d="M 26 9 L 14 21.5 L 26 34"/>
        </g>
      </g>
      <text x="86" y="64"
            font-family="PingFang SC, Hiragino Sans GB, Heiti SC, sans-serif"
            font-size="36" font-weight="700" fill="#0F1B2D">编辑</text>

      <!-- 已选择 4 项 (32sp Medium，padding 24/24/8/16 → 43/43/14/29) -->
      <text x="43" y="164"
            font-family="PingFang SC, Hiragino Sans GB, Heiti SC, sans-serif"
            font-size="58" font-weight="500" fill="#0F1B2D">已选择 4 项</text>

      <!-- AccountRow 模板：高 140, br 36, padding-left/right 43 -->
      <!-- Row 1: Google -->
      <g transform="translate(43 201)">
        <rect x="0" y="0" width="834" height="140" rx="36" fill="#FFFFFF"/>
        <g transform="translate(43 38)">
          <text x="0" y="0"
                font-family="PingFang SC, Hiragino Sans GB, Heiti SC, sans-serif"
                font-size="32" font-weight="500" fill="#0F1B2D">Google</text>
          <text x="0" y="40"
                font-family="PingFang SC, Hiragino Sans GB, Heiti SC, sans-serif"
                font-size="25" fill="#0F1B2D" fill-opacity="0.4">工作邮箱</text>
        </g>
        <!-- Checkbox 20×20 = 36, 圆角方形, 选中 -->
        <g transform="translate(755 52)">
          <rect x="0" y="0" width="36" height="36" rx="9" fill="#0A59F7"/>
          <path d="M 9 18 L 16 25 L 27 13" stroke="#FFFFFF" stroke-width="3.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        </g>
      </g>

      <!-- Row 2: Discord -->
      <g transform="translate(43 355)">
        <rect x="0" y="0" width="834" height="140" rx="36" fill="#FFFFFF"/>
        <g transform="translate(43 38)">
          <text x="0" y="0"
                font-family="PingFang SC, Hiragino Sans GB, Heiti SC, sans-serif"
                font-size="32" font-weight="500" fill="#0F1B2D">Discord</text>
          <text x="0" y="40"
                font-family="PingFang SC, Hiragino Sans GB, Heiti SC, sans-serif"
                font-size="25" fill="#0F1B2D" fill-opacity="0.4">游戏账号</text>
        </g>
        <g transform="translate(755 52)">
          <rect x="0" y="0" width="36" height="36" rx="9" fill="#0A59F7"/>
          <path d="M 9 18 L 16 25 L 27 13" stroke="#FFFFFF" stroke-width="3.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        </g>
      </g>

      <!-- Row 3: Sony -->
      <g transform="translate(43 509)">
        <rect x="0" y="0" width="834" height="140" rx="36" fill="#FFFFFF"/>
        <g transform="translate(43 38)">
          <text x="0" y="0"
                font-family="PingFang SC, Hiragino Sans GB, Heiti SC, sans-serif"
                font-size="32" font-weight="500" fill="#0F1B2D">Sony</text>
          <text x="0" y="40"
                font-family="PingFang SC, Hiragino Sans GB, Heiti SC, sans-serif"
                font-size="25" fill="#0F1B2D" fill-opacity="0.4">PlayStation</text>
        </g>
        <g transform="translate(755 52)">
          <rect x="0" y="0" width="36" height="36" rx="9" fill="#0A59F7"/>
          <path d="M 9 18 L 16 25 L 27 13" stroke="#FFFFFF" stroke-width="3.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        </g>
      </g>

      <!-- Row 4: Aliyun -->
      <g transform="translate(43 663)">
        <rect x="0" y="0" width="834" height="140" rx="36" fill="#FFFFFF"/>
        <g transform="translate(43 38)">
          <text x="0" y="0"
                font-family="PingFang SC, Hiragino Sans GB, Heiti SC, sans-serif"
                font-size="32" font-weight="500" fill="#0F1B2D">Aliyun</text>
          <text x="0" y="40"
                font-family="PingFang SC, Hiragino Sans GB, Heiti SC, sans-serif"
                font-size="25" fill="#0F1B2D" fill-opacity="0.4">主账号</text>
        </g>
        <g transform="translate(755 52)">
          <rect x="0" y="0" width="36" height="36" rx="9" fill="#0A59F7"/>
          <path d="M 9 18 L 16 25 L 27 13" stroke="#FFFFFF" stroke-width="3.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        </g>
      </g>

      <!-- Row 5: GitHub (未选中) -->
      <g transform="translate(43 817)">
        <rect x="0" y="0" width="834" height="140" rx="36" fill="#FFFFFF"/>
        <g transform="translate(43 38)">
          <text x="0" y="0"
                font-family="PingFang SC, Hiragino Sans GB, Heiti SC, sans-serif"
                font-size="32" font-weight="500" fill="#0F1B2D">GitHub</text>
          <text x="0" y="40"
                font-family="PingFang SC, Hiragino Sans GB, Heiti SC, sans-serif"
                font-size="25" fill="#0F1B2D" fill-opacity="0.4">开源协作</text>
        </g>
        <!-- 未选 checkbox: 圆角方形空框 -->
        <g transform="translate(755 52)">
          <rect x="0" y="0" width="36" height="36" rx="9" fill="none" stroke="#0F1B2D" stroke-opacity="0.25" stroke-width="2.4"/>
        </g>
      </g>

      <!-- ===== Toolbar 62vp = 112px, y=1268..1380 ===== -->
      <rect x="0" y="1268" width="920" height="112" fill="#F1F3F5"/>
      <!-- 上分割线（轻微） -->
      <line x1="0" y1="1268" x2="920" y2="1268" stroke="#0F1B2D" stroke-opacity="0.05" stroke-width="1"/>

      <!-- 删除按钮 (左) -->
      <g transform="translate(216 1280)">
        <g transform="translate(60 6)" opacity="1">
          <!-- 简化删除图标：trash -->
          <g stroke="#E84026" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <path d="M 6 12 H 38"/>
            <path d="M 16 12 V 8 H 28 V 12"/>
            <path d="M 9 12 V 38 H 35 V 12"/>
            <line x1="17" y1="18" x2="17" y2="32"/>
            <line x1="22" y1="18" x2="22" y2="32"/>
            <line x1="27" y1="18" x2="27" y2="32"/>
          </g>
        </g>
        <text x="80" y="80" text-anchor="middle"
              font-family="PingFang SC, Hiragino Sans GB, Heiti SC, sans-serif"
              font-size="18" font-weight="500" fill="#E84026">删除</text>
      </g>

      <!-- 导出按钮 (中) -->
      <g transform="translate(380 1280)">
        <g transform="translate(60 6)">
          <!-- export icon: arrow-up-from-box -->
          <g stroke="#0F1B2D" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <path d="M 22 6 V 30"/>
            <path d="M 12 16 L 22 6 L 32 16"/>
            <path d="M 6 30 V 40 H 38 V 30"/>
          </g>
        </g>
        <text x="80" y="80" text-anchor="middle"
              font-family="PingFang SC, Hiragino Sans GB, Heiti SC, sans-serif"
              font-size="18" font-weight="500" fill="#0F1B2D">导出</text>
      </g>

      <!-- 全选按钮 (右) -->
      <g transform="translate(544 1280)">
        <g transform="translate(60 6)">
          <!-- select-all icon: 多个 check 框 -->
          <g stroke="#0F1B2D" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <rect x="6" y="6" width="32" height="32" rx="6"/>
            <path d="M 14 22 L 20 28 L 32 14"/>
          </g>
        </g>
        <text x="80" y="80" text-anchor="middle"
              font-family="PingFang SC, Hiragino Sans GB, Heiti SC, sans-serif"
              font-size="18" font-weight="500" fill="#0F1B2D">全选</text>
      </g>

      <!-- ===== Scrim 半透蒙层 ===== -->
      <rect x="0" y="0" width="920" height="1380" fill="#000000" fill-opacity="0.5"/>
    </g>

    <!-- ===== PasswordDialog: width 344vp + margin 8/8 撑满, h≈452, 距底 14 ===== -->
    <g transform="translate(14 914)">
      <rect x="0" y="0" width="892" height="452" rx="36" fill="#FFFFFF"/>

      <!-- Title 20sp Medium, padding top 24 left 24 bottom 16 → 43/43/29 -->
      <text x="43" y="93"
            font-family="PingFang SC, Hiragino Sans GB, Heiti SC, sans-serif"
            font-size="36" font-weight="500" fill="#0F1B2D">设置备份密码</text>

      <!-- Input 1: y=122, h=86, br=22, bg #1A000000, padding 16/16, font 16 -->
      <g transform="translate(43 122)">
        <rect x="0" y="0" width="806" height="86" rx="22" fill="#0F1B2D" fill-opacity="0.08"/>
        <text x="29" y="56"
              font-family="PingFang SC, Hiragino Sans GB, Heiti SC, sans-serif"
              font-size="29" fill="#0F1B2D" fill-opacity="0.4">设置备份密码</text>
      </g>

      <!-- Input 2: y=222, h=86 -->
      <g transform="translate(43 222)">
        <rect x="0" y="0" width="806" height="86" rx="22" fill="#0F1B2D" fill-opacity="0.08"/>
        <text x="29" y="56"
              font-family="PingFang SC, Hiragino Sans GB, Heiti SC, sans-serif"
              font-size="29" fill="#0F1B2D" fill-opacity="0.4">再次输入密码</text>
      </g>

      <!-- Buttons row: y=336, h=86 -->
      <g transform="translate(43 336)">
        <!-- Cancel button -->
        <rect x="0" y="0" width="396" height="86" rx="43" fill="#0F1B2D" fill-opacity="0.08"/>
        <text x="198" y="56" text-anchor="middle"
              font-family="PingFang SC, Hiragino Sans GB, Heiti SC, sans-serif"
              font-size="32" font-weight="500" fill="#0A59F7">取消</text>
        <!-- Save button -->
        <rect x="410" y="0" width="396" height="86" rx="43" fill="#0F1B2D" fill-opacity="0.08"/>
        <text x="608" y="56" text-anchor="middle"
              font-family="PingFang SC, Hiragino Sans GB, Heiti SC, sans-serif"
              font-size="32" font-weight="500" fill="#0A59F7">保存</text>
      </g>
    </g>
  </g>

  <g transform="translate(440 1810)">
    <rect x="0" y="-50" width="64" height="64" rx="14" fill="#0A59F7"/>
    <g transform="translate(32 -18)">
      <rect x="-14" y="-4" width="28" height="8" rx="4" fill="#FFFFFF"/>
      <rect x="-14" y="-4" width="28" height="8" rx="4" fill="#FFFFFF" transform="rotate(60)"/>
      <rect x="-14" y="-4" width="28" height="8" rx="4" fill="#FFFFFF" transform="rotate(120)"/>
    </g>
    <text x="84" y="0" font-family="PingFang SC, Hiragino Sans GB, Heiti SC, sans-serif"
          font-size="40" font-weight="700" fill="#0F1B2D">Rotor</text>
  </g>
</svg>
