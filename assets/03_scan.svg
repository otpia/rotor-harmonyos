<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E7EEFC"/>
      <stop offset="1" stop-color="#F4F6FA"/>
    </linearGradient>
    <linearGradient id="phoneBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1A1F2B"/>
      <stop offset="1" stop-color="#0B0F18"/>
    </linearGradient>
    <linearGradient id="scanLine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0A59F7" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#0A59F7" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#0A59F7" stop-opacity="0"/>
    </linearGradient>
    <filter id="phoneShadow" x="-10%" y="-5%" width="120%" height="115%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="24"/>
      <feOffset dx="0" dy="24"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.18"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="qr" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="20" height="20" fill="#FFFFFF"/>
      <rect x="2" y="2" width="8" height="8" fill="#0F1B2D"/>
      <rect x="12" y="6" width="6" height="6" fill="#0F1B2D"/>
      <rect x="6" y="12" width="6" height="10" fill="#0F1B2D"/>
    </pattern>
  </defs>

  <rect width="1080" height="1920" fill="url(#bg)"/>

  <text x="540" y="180" text-anchor="middle"
        font-family="PingFang SC, Hiragino Sans GB, Heiti SC, sans-serif"
        font-size="84" font-weight="800" fill="#0F1B2D" letter-spacing="2">扫码秒加 · 一键导入</text>
  <text x="540" y="262" text-anchor="middle"
        font-family="PingFang SC, Hiragino Sans GB, Heiti SC, sans-serif"
        font-size="38" font-weight="400" fill="#5A6478" letter-spacing="2">支持 otpauth:// 标准二维码 · 也可手动输入</text>

  <g filter="url(#phoneShadow)" transform="translate(80 360)">
    <rect x="0" y="0" width="920" height="1380" rx="56" fill="url(#phoneBg)"/>

    <!-- 顶部 close + 标题 -->
    <g transform="translate(48 56)">
      <rect x="0" y="0" width="56" height="56" rx="28" fill="#FFFFFF" fill-opacity="0.12"/>
      <line x1="18" y1="18" x2="38" y2="38" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
      <line x1="38" y1="18" x2="18" y2="38" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
    </g>
    <text x="460" y="92" text-anchor="middle"
          font-family="PingFang SC, Hiragino Sans GB, Heiti SC, sans-serif"
          font-size="32" font-weight="600" fill="#FFFFFF">扫描二维码</text>

    <!-- 扫描框 -->
    <g transform="translate(190 360)">
      <!-- mock QR 内容 -->
      <rect x="0" y="0" width="540" height="540" rx="20" fill="url(#qr)"/>
      <!-- 半透明 overlay -->
      <rect x="0" y="0" width="540" height="540" rx="20" fill="#000000" fill-opacity="0.18"/>
      <!-- 4 个角标 -->
      <g stroke="#0A59F7" stroke-width="8" stroke-linecap="round" fill="none">
        <path d="M 0 60 L 0 0 L 60 0"/>
        <path d="M 480 0 L 540 0 L 540 60"/>
        <path d="M 540 480 L 540 540 L 480 540"/>
        <path d="M 60 540 L 0 540 L 0 480"/>
      </g>
      <!-- 扫描线 -->
      <rect x="20" y="240" width="500" height="60" rx="6" fill="url(#scanLine)" opacity="0.85"/>
    </g>

    <!-- 提示文字 -->
    <text x="460" y="1020" text-anchor="middle"
          font-family="PingFang SC, Hiragino Sans GB, Heiti SC, sans-serif"
          font-size="32" fill="#FFFFFF" fill-opacity="0.9">将二维码放入框内 · 自动识别</text>
    <text x="460" y="1080" text-anchor="middle"
          font-family="PingFang SC, Hiragino Sans GB, Heiti SC, sans-serif"
          font-size="26" fill="#FFFFFF" fill-opacity="0.5">otpauth://totp/...</text>

    <!-- 底部三个特性 -->
    <g transform="translate(48 1180)">
      <rect x="0" y="0" width="824" height="140" rx="28" fill="#FFFFFF" fill-opacity="0.08"/>
      <g transform="translate(60 50)">
        <circle cx="20" cy="20" r="20" fill="#0A59F7"/>
        <path d="M 12 20 L 18 26 L 28 14" stroke="#FFFFFF" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="60" y="20"
              font-family="PingFang SC, Hiragino Sans GB, Heiti SC, sans-serif"
              font-size="26" font-weight="600" fill="#FFFFFF">自动识别</text>
        <text x="60" y="56"
              font-family="PingFang SC, Hiragino Sans GB, Heiti SC, sans-serif"
              font-size="22" fill="#FFFFFF" fill-opacity="0.6">扫一下就好</text>
      </g>
      <g transform="translate(330 50)">
        <circle cx="20" cy="20" r="20" fill="#0A59F7"/>
        <path d="M 12 20 L 18 26 L 28 14" stroke="#FFFFFF" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="60" y="20"
              font-family="PingFang SC, Hiragino Sans GB, Heiti SC, sans-serif"
              font-size="26" font-weight="600" fill="#FFFFFF">秘钥不入网</text>
        <text x="60" y="56"
              font-family="PingFang SC, Hiragino Sans GB, Heiti SC, sans-serif"
              font-size="22" fill="#FFFFFF" fill-opacity="0.6">扫描全程离线</text>
      </g>
      <g transform="translate(600 50)">
        <circle cx="20" cy="20" r="20" fill="#0A59F7"/>
        <path d="M 12 20 L 18 26 L 28 14" stroke="#FFFFFF" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="60" y="20"
              font-family="PingFang SC, Hiragino Sans GB, Heiti SC, sans-serif"
              font-size="26" font-weight="600" fill="#FFFFFF">兼容标准</text>
        <text x="60" y="56"
              font-family="PingFang SC, Hiragino Sans GB, Heiti SC, sans-serif"
              font-size="22" fill="#FFFFFF" fill-opacity="0.6">RFC 6238</text>
      </g>
    </g>
  </g>

  <g transform="translate(440 1810)">
    <rect x="0" y="-50" width="64" height="64" rx="14" fill="#0A59F7"/>
    <g transform="translate(32 -18)">
      <rect x="-14" y="-4" width="28" height="8" rx="4" fill="#FFFFFF"/>
      <rect x="-14" y="-4" width="28" height="8" rx="4" fill="#FFFFFF" transform="rotate(60)"/>
      <rect x="-14" y="-4" width="28" height="8" rx="4" fill="#FFFFFF" transform="rotate(120)"/>
    </g>
    <text x="84" y="0" font-family="PingFang SC, Hiragino Sans GB, Heiti SC, sans-serif"
          font-size="40" font-weight="700" fill="#0F1B2D">Rotor</text>
  </g>
</svg>
