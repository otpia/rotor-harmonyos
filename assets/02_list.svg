<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E7EEFC"/>
      <stop offset="1" stop-color="#F4F6FA"/>
    </linearGradient>
    <filter id="phoneShadow" x="-10%" y="-5%" width="120%" height="115%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="24"/>
      <feOffset dx="0" dy="24"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.18"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1080" height="1920" fill="url(#bg)"/>

  <text x="540" y="180" text-anchor="middle"
        font-family="PingFang SC, Hiragino Sans GB, Heiti SC, sans-serif"
        font-size="84" font-weight="800" fill="#0F1B2D" letter-spacing="2">动态验证码，一目了然</text>
  <text x="540" y="262" text-anchor="middle"
        font-family="PingFang SC, Hiragino Sans GB, Heiti SC, sans-serif"
        font-size="38" font-weight="400" fill="#5A6478" letter-spacing="2">圆环倒计时，快过期时变色，点一下即复制</text>

  <!-- Phone mockup: 920×1380, 内部按 vp→px=1.8 系数 -->
  <g filter="url(#phoneShadow)" transform="translate(80 360)">
    <rect x="0" y="0" width="920" height="1380" rx="56" fill="#F1F3F5"/>

    <!-- 顶部 nav row 56vp = 101 -->
    <g transform="translate(862 38)">
      <circle cx="0" cy="0" r="3.5" fill="#0F1B2D"/>
      <circle cx="11" cy="0" r="3.5" fill="#0F1B2D"/>
      <circle cx="22" cy="0" r="3.5" fill="#0F1B2D"/>
    </g>

    <!-- SearchBar: margin (24/8/24/16), height 40, br 20, bg bg_card_active 0D000000 -->
    <g transform="translate(43 115)">
      <rect x="0" y="0" width="834" height="72" rx="36" fill="#0F1B2D" fill-opacity="0.05"/>
      <g transform="translate(28 24)" stroke="#0F1B2D" stroke-opacity="0.4" stroke-width="2.4" fill="none">
        <circle cx="11" cy="11" r="9"/>
        <line x1="18" y1="18" x2="26" y2="26" stroke-linecap="round"/>
      </g>
      <text x="74" y="46"
            font-family="PingFang SC, Hiragino Sans GB, Heiti SC, sans-serif"
            font-size="25" fill="#0F1B2D" fill-opacity="0.4">搜索</text>
    </g>

    <!-- 列表起始 y = 56+8+40+16 = 120vp = 216px ; 列表 padding 24 = 43 -->
    <!-- 卡片 1: Google · 20s 剩 → ring 240° -->
    <g transform="translate(43 216)">
      <rect x="0" y="0" width="834" height="270" rx="36" fill="#FFFFFF"/>
      <!-- row1: icon 24×24 + name 16 -->
      <g transform="translate(43 29)">
        <circle cx="22" cy="22" r="22" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
        <text x="22" y="32" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#4285F4">G</text>
        <text x="58" y="33"
              font-family="PingFang SC, Hiragino Sans GB, Heiti SC, sans-serif"
              font-size="29" font-weight="500" fill="#0F1B2D">Google</text>
      </g>
      <!-- row2: code 40 + ring 40×40 -->
      <text x="43" y="158"
            font-family="HarmonyOS Sans, Helvetica Neue, sans-serif"
            font-size="72" font-weight="800" fill="#0F1B2D">481 925</text>
      <g transform="translate(719 110)">
        <path d="M 36 4 A 32 32 0 1 1 8.3 52" fill="none" stroke="#0F1B2D" stroke-width="5" stroke-linecap="round"/>
      </g>
      <!-- row3: note 14 -->
      <text x="43" y="222"
            font-family="PingFang SC, Hiragino Sans GB, Heiti SC, sans-serif"
            font-size="25" fill="#0F1B2D" fill-opacity="0.4">工作邮箱</text>
    </g>

    <!-- 卡片 2: Discord · 12s 剩 → ring 144° -->
    <g transform="translate(43 508)">
      <rect x="0" y="0" width="834" height="270" rx="36" fill="#FFFFFF"/>
      <g transform="translate(43 29)">
        <circle cx="22" cy="22" r="22" fill="#5865F2"/>
        <text x="22" y="32" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#FFFFFF">D</text>
        <text x="58" y="33"
              font-family="PingFang SC, Hiragino Sans GB, Heiti SC, sans-serif"
              font-size="29" font-weight="500" fill="#0F1B2D">Discord</text>
      </g>
      <text x="43" y="158"
            font-family="HarmonyOS Sans, Helvetica Neue, sans-serif"
            font-size="72" font-weight="800" fill="#0F1B2D">367 042</text>
      <g transform="translate(719 110)">
        <path d="M 36 4 A 32 32 0 0 1 54.8 61.9" fill="none" stroke="#0F1B2D" stroke-width="5" stroke-linecap="round"/>
      </g>
      <text x="43" y="222"
            font-family="PingFang SC, Hiragino Sans GB, Heiti SC, sans-serif"
            font-size="25" fill="#0F1B2D" fill-opacity="0.4">游戏账号</text>
    </g>

    <!-- 卡片 3: Sony · 3s 剩（红） → ring 36° -->
    <g transform="translate(43 800)">
      <rect x="0" y="0" width="834" height="270" rx="36" fill="#FFFFFF"/>
      <g transform="translate(43 29)">
        <circle cx="22" cy="22" r="22" fill="#000000"/>
        <text x="22" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">S</text>
        <text x="58" y="33"
              font-family="PingFang SC, Hiragino Sans GB, Heiti SC, sans-serif"
              font-size="29" font-weight="500" fill="#0F1B2D">Sony</text>
      </g>
      <text x="43" y="158"
            font-family="HarmonyOS Sans, Helvetica Neue, sans-serif"
            font-size="72" font-weight="800" fill="#E84026">158 274</text>
      <g transform="translate(719 110)">
        <path d="M 36 4 A 32 32 0 0 1 54.8 10.1" fill="none" stroke="#E84026" stroke-width="5" stroke-linecap="round"/>
      </g>
      <text x="43" y="222"
            font-family="PingFang SC, Hiragino Sans GB, Heiti SC, sans-serif"
            font-size="25" fill="#0F1B2D" fill-opacity="0.4">PlayStation</text>
    </g>

    <!-- 卡片 4: Aliyun · 25s 剩 → ring 300° -->
    <g transform="translate(43 1092)">
      <rect x="0" y="0" width="834" height="270" rx="36" fill="#FFFFFF"/>
      <g transform="translate(43 29)">
        <circle cx="22" cy="22" r="22" fill="#FF6A00"/>
        <text x="22" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">A</text>
        <text x="58" y="33"
              font-family="PingFang SC, Hiragino Sans GB, Heiti SC, sans-serif"
              font-size="29" font-weight="500" fill="#0F1B2D">Aliyun</text>
      </g>
      <text x="43" y="158"
            font-family="HarmonyOS Sans, Helvetica Neue, sans-serif"
            font-size="72" font-weight="800" fill="#0F1B2D">692 153</text>
      <g transform="translate(719 110)">
        <path d="M 36 4 A 32 32 0 1 1 8.3 20" fill="none" stroke="#0F1B2D" stroke-width="5" stroke-linecap="round"/>
      </g>
      <text x="43" y="222"
            font-family="PingFang SC, Hiragino Sans GB, Heiti SC, sans-serif"
            font-size="25" fill="#0F1B2D" fill-opacity="0.4">主账号</text>
    </g>

    <!-- FAB: 56×56 → 100×100, position right 24 bottom 24 = 43/43 -->
    <g transform="translate(777 1237)">
      <circle cx="50" cy="50" r="50" fill="#0A59F7"/>
      <line x1="50" y1="26" x2="50" y2="74" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
      <line x1="26" y1="50" x2="74" y2="50" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
    </g>
  </g>

  <g transform="translate(440 1810)">
    <rect x="0" y="-50" width="64" height="64" rx="14" fill="#0A59F7"/>
    <g transform="translate(32 -18)">
      <rect x="-14" y="-4" width="28" height="8" rx="4" fill="#FFFFFF"/>
      <rect x="-14" y="-4" width="28" height="8" rx="4" fill="#FFFFFF" transform="rotate(60)"/>
      <rect x="-14" y="-4" width="28" height="8" rx="4" fill="#FFFFFF" transform="rotate(120)"/>
    </g>
    <text x="84" y="0" font-family="PingFang SC, Hiragino Sans GB, Heiti SC, sans-serif"
          font-size="40" font-weight="700" fill="#0F1B2D">Rotor</text>
  </g>
</svg>
